name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Lint and build bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint source (AIR ruleset)
        run: npm run lint

      - name: Build bundle
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: user_steward.js
          path: build/user_steward.js
          if-no-files-found: error
          retention-days: 14
