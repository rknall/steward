<title>Review Set</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Review desk: a quiet sidebar of pages on the left, the page under review in the
   middle, the verdict panel underneath it. Shell chrome only; mockup content gets
   its own scoped steward look and never inherits these rules. */
:root {
  --rv-bg: #f3f4f6;
  --rv-panel: #ffffff;
  --rv-ink: #1c2330;
  --rv-muted: #5b6474;
  --rv-line: #d8dce3;
  --rv-accent: #2f5d8a;
  --rv-accent-ink: #ffffff;
  --rv-accent-soft: #e3ecf5;
  --rv-ok: #2c7a4b;
  --rv-ok-soft: #e1f2e7;
  --rv-bad: #b23b32;
  --rv-bad-soft: #f8e3e1;
  --rv-stale: #8a6413;
  --rv-stale-soft: #f6ecd4;
  --rv-code: #eceef2;
  --rv-font: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --rv-mono: ui-monospace, "Cascadia Mono", Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --rv-bg: #12161d;
    --rv-panel: #1a2029;
    --rv-ink: #e4e8ee;
    --rv-muted: #9aa4b4;
    --rv-line: #2f3845;
    --rv-accent: #7fb0e0;
    --rv-accent-ink: #0e1620;
    --rv-accent-soft: #22344a;
    --rv-ok: #6cc28f;
    --rv-ok-soft: #1c3326;
    --rv-bad: #ec8a80;
    --rv-bad-soft: #3d2220;
    --rv-stale: #e0b65c;
    --rv-stale-soft: #3a3020;
    --rv-code: #232a35;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --rv-bg: #12161d;
  --rv-panel: #1a2029;
  --rv-ink: #e4e8ee;
  --rv-muted: #9aa4b4;
  --rv-line: #2f3845;
  --rv-accent: #7fb0e0;
  --rv-accent-ink: #0e1620;
  --rv-accent-soft: #22344a;
  --rv-ok: #6cc28f;
  --rv-ok-soft: #1c3326;
  --rv-bad: #ec8a80;
  --rv-bad-soft: #3d2220;
  --rv-stale: #e0b65c;
  --rv-stale-soft: #3a3020;
  --rv-code: #232a35;
  color-scheme: dark;
}
/* The published skeleton already has this; repeated so a local preview behaves the same. */
[hidden] { display: none !important; }
body { background: var(--rv-bg); color: var(--rv-ink); font-family: var(--rv-font); font-size: 15px; line-height: 1.5; }
.rv-shell {
  box-sizing: border-box; display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 24px;
  max-width: 1320px; margin: 0 auto; padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.rv-shell *, .rv-shell *::before, .rv-shell *::after { box-sizing: border-box; }

/* Sidebar */
#rv-nav { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); align-self: start; min-width: 0; }
#rv-nav-menu > summary { display: none; }
.rv-nav-head { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--rv-muted); margin: 4px 0 8px; }
#rv-nav-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.rv-nav-link {
  display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; align-items: center; gap: 8px;
  padding: 7px 8px; border-radius: 6px; color: var(--rv-ink); text-decoration: none;
}
.rv-nav-link:hover { background: var(--rv-panel); }
.rv-nav-link[aria-current="page"] { background: var(--rv-accent-soft); font-weight: 600; }
.rv-nav-num { font-size: 12px; color: var(--rv-muted); font-variant-numeric: tabular-nums; text-align: right; }
.rv-nav-title { overflow-wrap: anywhere; }
.rv-badge {
  display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px;
  border-radius: 50%; font-size: 12px; font-weight: 700; line-height: 1; border: 1.5px solid var(--rv-line); color: var(--rv-muted);
}
.rv-badge[data-status="approve"] { background: var(--rv-ok-soft); border-color: var(--rv-ok); color: var(--rv-ok); }
.rv-badge[data-status="disapprove"] { background: var(--rv-bad-soft); border-color: var(--rv-bad); color: var(--rv-bad); }
.rv-badge[data-status="stale"] { background: var(--rv-stale-soft); border-color: var(--rv-stale); color: var(--rv-stale); }
#rv-progress { margin-top: 14px; font-size: 13px; color: var(--rv-muted); font-variant-numeric: tabular-nums; }

/* Main column */
#rv-main { min-width: 0; display: grid; gap: 16px; align-content: start; }
.rv-head { display: grid; gap: 6px; }
.rv-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13px; color: var(--rv-muted); }
#rv-kind {
  font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  padding: 2px 8px; border-radius: 4px; background: var(--rv-accent); color: var(--rv-accent-ink);
}
#rv-rev { font-variant-numeric: tabular-nums; }
#rv-title { margin: 0; font-size: 26px; line-height: 1.2; text-wrap: balance; }
#rv-summary { margin: 0; color: var(--rv-muted); max-width: 70ch; }

#rv-options { display: flex; flex-wrap: wrap; gap: 12px 20px; padding: 10px 12px; background: var(--rv-panel); border: 1px solid var(--rv-line); border-radius: 8px; }
.rv-opt { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.rv-opt-label { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--rv-muted); }
.rv-seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--rv-line); border-radius: 6px; overflow: hidden; }
.rv-seg button {
  font: inherit; font-size: 14px; padding: 5px 12px; border: 0; border-right: 1px solid var(--rv-line);
  background: transparent; color: var(--rv-ink); cursor: pointer;
}
.rv-seg button:last-child { border-right: 0; }
.rv-seg button[aria-pressed="true"] { background: var(--rv-accent); color: var(--rv-accent-ink); }

/* Content area: prose styles reach only direct children of a page section, so a
   mockup frame (always wrapped in .rv-scroll) keeps the scoped steward look. */
#rv-content { min-width: 0; }
#rv-content > section > h2 { font-size: 19px; margin: 18px 0 6px; text-wrap: balance; }
#rv-content > section > h3 { font-size: 16px; margin: 14px 0 4px; }
#rv-content > section > p,
#rv-content > section > ul,
#rv-content > section > ol { max-width: 72ch; margin: 0 0 10px; }
#rv-content > section > pre { background: var(--rv-code); padding: 10px 12px; border-radius: 6px; overflow-x: auto; font-family: var(--rv-mono); font-size: 13px; }
#rv-content > section code { font-family: var(--rv-mono); font-size: .92em; background: var(--rv-code); padding: 0 4px; border-radius: 3px; }
.rv-scroll { overflow-x: auto; max-width: 100%; margin: 8px 0 14px; }

/* Verdict panel */
#rv-verdict { display: grid; gap: 10px; padding: 14px; background: var(--rv-panel); border: 1px solid var(--rv-line); border-radius: 8px; }
#rv-banner { margin: 0; padding: 8px 10px; border-radius: 6px; background: var(--rv-stale-soft); color: var(--rv-ink); font-size: 14px; }
.rv-comment-label { font-size: 13px; font-weight: 600; }
#rv-comment {
  width: 100%; min-height: 88px; resize: vertical; font: inherit; padding: 8px 10px;
  border: 1px solid var(--rv-line); border-radius: 6px; background: var(--rv-bg); color: var(--rv-ink);
}
#rv-error { margin: 0; color: var(--rv-bad); font-size: 14px; }
.rv-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.rv-btn {
  font: inherit; font-size: 14px; padding: 7px 14px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--rv-line); background: var(--rv-panel); color: var(--rv-ink);
}
.rv-btn:disabled { opacity: .5; cursor: not-allowed; }
#rv-approve { border-color: var(--rv-ok); color: var(--rv-ok); }
#rv-approve:not(:disabled):hover { background: var(--rv-ok-soft); }
#rv-disapprove { border-color: var(--rv-bad); color: var(--rv-bad); }
#rv-disapprove:not(:disabled):hover { background: var(--rv-bad-soft); }
.rv-spacer { flex: 1 1 auto; }
#rv-status { margin: 0; font-size: 14px; color: var(--rv-muted); overflow-wrap: anywhere; }
#rv-status[data-status="approve"] { color: var(--rv-ok); }
#rv-status[data-status="disapprove"] { color: var(--rv-bad); }
#rv-status[data-status="stale"], #rv-status[data-status="error"] { color: var(--rv-stale); }
#rv-copy-msg { font-size: 13px; color: var(--rv-muted); }
#rv-feedback { width: 100%; min-height: 120px; font-family: var(--rv-mono); font-size: 12px; padding: 8px; border: 1px solid var(--rv-line); border-radius: 6px; background: var(--rv-bg); color: var(--rv-ink); }
.rv-pager { display: flex; justify-content: space-between; gap: 8px; }

:focus-visible { outline: 2px solid var(--rv-accent); outline-offset: 2px; }

@media (max-width: 720px) {
  .rv-shell { grid-template-columns: minmax(0, 1fr); gap: 14px; padding-block: 12px 32px; }
  #rv-nav { position: static; }
  #rv-nav-menu { background: var(--rv-panel); border: 1px solid var(--rv-line); border-radius: 8px; padding: 8px 10px; }
  #rv-nav-menu > summary { display: list-item; cursor: pointer; font-weight: 600; }
  #rv-nav-menu[open] > summary { margin-bottom: 8px; }
  .rv-nav-head { display: none; }
  #rv-title { font-size: 22px; }
}
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>

<script id="rv-logic">
/* Pure review-set logic. It touches no page or browser globals so tests can run it
   in an empty sandbox; the app script below does all the wiring. */
var RV = (function () {
	'use strict';

	var VERDICTS = ['approve', 'disapprove'];

	function parseSet(text) {
		var set = JSON.parse(text);
		if (!set || typeof set !== 'object' || !(set.pages instanceof Array) || !set.pages.length) {
			throw new Error('review-set: "pages" must be a non-empty list');
		}
		return set;
	}

	function pageIndex(set, hash) {
		var id = String(hash || '');
		if (id.charAt(0) === '#') { id = id.slice(1); }
		if (!id) { return 0; }
		for (var i = 0; i < set.pages.length; i++) {
			if (set.pages[i].id === id) { return i; }
		}
		return 0;
	}

	function defaultState(page) {
		var state = {};
		var opts = (page && page.options) || [];
		for (var i = 0; i < opts.length; i++) {
			if (opts[i].values && opts[i].values.length) { state[opts[i].id] = opts[i].values[0].id; }
		}
		return state;
	}

	function parseWhen(str) {
		var out = [];
		var parts = String(str || '').split('&');
		for (var i = 0; i < parts.length; i++) {
			var part = parts[i];
			if (!part.replace(/\s+/g, '')) { continue; }
			var eq = part.indexOf('=');
			if (eq < 0) {
				out.push({ opt: part.trim(), val: '' });
			} else {
				out.push({ opt: part.slice(0, eq).trim(), val: part.slice(eq + 1).trim() });
			}
		}
		return out;
	}

	function matches(str, state) {
		var conds = parseWhen(str);
		for (var i = 0; i < conds.length; i++) {
			if (!state || !Object.prototype.hasOwnProperty.call(state, conds[i].opt)) { return false; }
			if (state[conds[i].opt] !== conds[i].val) { return false; }
		}
		return true;
	}

	function copyState(state) {
		var out = {};
		for (var k in state) {
			if (Object.prototype.hasOwnProperty.call(state, k)) { out[k] = state[k]; }
		}
		return out;
	}

	function makeVerdict(set, page, verdict, comment, state, userId, nowIso) {
		if (VERDICTS.indexOf(verdict) < 0) {
			return { error: 'Unknown verdict "' + verdict + '".' };
		}
		var text = String(comment === undefined || comment === null ? '' : comment).trim();
		if (verdict === 'disapprove' && !text) {
			return { error: 'Write what should change before you disapprove this page.' };
		}
		return { doc: {
			set: set.set,
			page: page.id,
			verdict: verdict,
			comment: text,
			rev: set.rev,
			options: copyState(state || {}),
			by: userId || null,
			at: nowIso
		} };
	}

	// Stored rows are written by viewers, so anything malformed counts as no verdict.
	function status(set, doc) {
		if (!doc || typeof doc !== 'object' || VERDICTS.indexOf(doc.verdict) < 0) { return 'none'; }
		if (doc.rev !== set.rev || doc.set !== set.set) { return 'stale'; }
		return doc.verdict;
	}

	function progress(set, docsById) {
		var out = { approved: 0, disapproved: 0, pending: 0, total: set.pages.length };
		for (var i = 0; i < set.pages.length; i++) {
			var s = status(set, docsById ? docsById[set.pages[i].id] : null);
			if (s === 'approve') { out.approved++; } else if (s === 'disapprove') { out.disapproved++; } else { out.pending++; }
		}
		return out;
	}

	function feedback(set, docsById) {
		var list = [];
		for (var i = 0; i < set.pages.length; i++) {
			var doc = docsById ? docsById[set.pages[i].id] : null;
			var s = status(set, doc);
			if (s === 'approve' || s === 'disapprove') { list.push(doc); }
		}
		return JSON.stringify(list, null, 2);
	}

	return {
		parseSet: parseSet,
		pageIndex: pageIndex,
		defaultState: defaultState,
		parseWhen: parseWhen,
		matches: matches,
		makeVerdict: makeVerdict,
		status: status,
		progress: progress,
		feedback: feedback
	};
})();
</script>

<script id="rv-app">
(function () {
	'use strict';

	var KIND_LABEL = { mockup: 'Mockup', plan: 'Plan', explainer: 'Explainer' };
	var BADGE = { none: '', approve: '✓', disapprove: '✕', stale: '!' };
	var BADGE_TEXT = { none: 'No verdict yet', approve: 'Approved', disapprove: 'Disapproved', stale: 'Verdict out of date' };
	var NARROW = '(max-width: 720px)';

	function $(id) { return document.getElementById(id); }

	function store(key, value) {
		try {
			if (value === null) { window.localStorage.removeItem(key); } else { window.localStorage.setItem(key, value); }
		} catch (e) { /* storage blocked: conveniences only */ }
	}
	function load(key) {
		try { return window.localStorage.getItem(key); } catch (e) { return null; }
	}

	var set;
	try {
		set = RV.parseSet($('review-set').textContent);
	} catch (e) {
		$('rv-title').textContent = 'This review set could not be read';
		$('rv-summary').textContent = String(e && e.message ? e.message : e);
		return;
	}

	var prefix = 'rv:' + set.set + ':';
	var mode = 'pending';   // pending | db | local
	var db = null;
	var userId = null;
	var docs = {};
	var opts = {};
	var current = 0;
	var writing = false;
	var loadTimer = null;
	var sections = {};

	var secs = $('rv-content').querySelectorAll('section');
	for (var s = 0; s < secs.length; s++) {
		var pid = secs[s].getAttribute('data-page');
		if (pid) { sections[pid] = secs[s]; }
	}

	// Option state per page: the stored choice when it still names a real value.
	function pageOpts(page) {
		if (opts[page.id]) { return opts[page.id]; }
		var state = RV.defaultState(page);
		var saved = null;
		try { saved = JSON.parse(load(prefix + 'opts:' + page.id) || 'null'); } catch (e) { saved = null; }
		var list = page.options || [];
		if (saved && typeof saved === 'object') {
			for (var i = 0; i < list.length; i++) {
				var v = saved[list[i].id];
				for (var j = 0; j < (list[i].values || []).length; j++) {
					if (list[i].values[j].id === v) { state[list[i].id] = v; }
				}
			}
		}
		opts[page.id] = state;
		return state;
	}

	function buildNav() {
		var ol = $('rv-nav-list');
		ol.textContent = '';
		for (var i = 0; i < set.pages.length; i++) {
			var page = set.pages[i];
			var li = document.createElement('li');
			var a = document.createElement('a');
			a.className = 'rv-nav-link';
			a.href = '#' + page.id;
			a.id = 'rv-nav-' + page.id;
			var num = document.createElement('span');
			num.className = 'rv-nav-num';
			num.textContent = String(i + 1);
			var title = document.createElement('span');
			title.className = 'rv-nav-title';
			title.textContent = page.title;
			var badge = document.createElement('span');
			badge.className = 'rv-badge';
			badge.setAttribute('data-page-badge', page.id);
			a.appendChild(num);
			a.appendChild(title);
			a.appendChild(badge);
			a.addEventListener('click', function () {
				if (window.matchMedia && window.matchMedia(NARROW).matches) { $('rv-nav-menu').open = false; }
			});
			li.appendChild(a);
			ol.appendChild(li);
		}
	}

	function renderOptions(page) {
		var box = $('rv-options');
		box.textContent = '';
		var list = page.options || [];
		box.hidden = !list.length;
		var state = pageOpts(page);
		for (var i = 0; i < list.length; i++) {
			var opt = list[i];
			var group = document.createElement('div');
			group.className = 'rv-opt';
			var label = document.createElement('span');
			label.className = 'rv-opt-label';
			label.id = 'rv-opt-' + opt.id + '-label';
			label.textContent = opt.label || opt.id;
			var seg = document.createElement('div');
			seg.className = 'rv-seg';
			seg.setAttribute('role', 'group');
			seg.setAttribute('aria-labelledby', label.id);
			for (var j = 0; j < (opt.values || []).length; j++) {
				var val = opt.values[j];
				var b = document.createElement('button');
				b.type = 'button';
				b.id = 'rv-opt-' + opt.id + '-' + val.id;
				b.textContent = val.label || val.id;
				b.setAttribute('aria-pressed', state[opt.id] === val.id ? 'true' : 'false');
				b.addEventListener('click', optionClick(page, opt.id, val.id));
				seg.appendChild(b);
			}
			group.appendChild(label);
			group.appendChild(seg);
			box.appendChild(group);
		}
	}

	function optionClick(page, optId, valId) {
		return function () {
			var state = pageOpts(page);
			state[optId] = valId;
			store(prefix + 'opts:' + page.id, JSON.stringify(state));
			renderOptions(page);
			applyWhen(page);
		};
	}

	function applyWhen(page) {
		var sec = sections[page.id];
		if (!sec) { return; }
		var state = pageOpts(page);
		var els = sec.querySelectorAll('[data-when]');
		for (var i = 0; i < els.length; i++) {
			els[i].hidden = !RV.matches(els[i].getAttribute('data-when'), state);
		}
	}

	function renderVerdicts() {
		for (var i = 0; i < set.pages.length; i++) {
			var page = set.pages[i];
			var st = RV.status(set, docs[page.id]);
			var badge = document.querySelector('[data-page-badge="' + page.id + '"]');
			if (badge) {
				badge.setAttribute('data-status', st);
				badge.textContent = BADGE[st];
				badge.title = BADGE_TEXT[st];
				badge.setAttribute('aria-label', BADGE_TEXT[st]);
			}
		}
		var page0 = set.pages[current];
		var doc = docs[page0.id];
		var st0 = RV.status(set, doc);
		var el = $('rv-status');
		el.setAttribute('data-status', st0);
		if (st0 === 'none') {
			el.textContent = 'No verdict yet';
		} else if (st0 === 'stale') {
			el.textContent = 'Recorded for rev ' + doc.rev + (doc.set !== set.set ? ' of another set' : '') + ', out of date';
		} else {
			el.textContent = (st0 === 'approve' ? 'Approved' : 'Disapproved') + ' for rev ' + doc.rev +
				(doc.comment ? ': “' + doc.comment + '”' : '');
		}
		var p = RV.progress(set, docs);
		var line = p.approved + ' of ' + p.total + ' pages approved';
		if (p.disapproved) { line += ', ' + p.disapproved + ' disapproved'; }
		$('rv-progress').textContent = line;
		$('rv-nav-summary').textContent = 'Pages · ' + (current + 1) + ' of ' + p.total + ' · ' + p.approved + ' approved';
		var busy = mode === 'pending' || writing;
		$('rv-approve').disabled = busy;
		$('rv-disapprove').disabled = busy;
	}

	function render() {
		current = RV.pageIndex(set, window.location.hash);
		var page = set.pages[current];
		$('rv-kind').textContent = KIND_LABEL[set.kind] || 'Review';
		$('rv-set-name').textContent = set.set;
		$('rv-rev').textContent = 'rev ' + set.rev;
		$('rv-title').textContent = page.title;
		$('rv-summary').textContent = page.summary || '';
		for (var id in sections) {
			if (Object.prototype.hasOwnProperty.call(sections, id)) { sections[id].hidden = id !== page.id; }
		}
		var links = document.querySelectorAll('.rv-nav-link');
		for (var i = 0; i < links.length; i++) {
			if (links[i].id === 'rv-nav-' + page.id) { links[i].setAttribute('aria-current', 'page'); } else { links[i].removeAttribute('aria-current'); }
		}
		renderOptions(page);
		applyWhen(page);
		$('rv-comment').value = load(prefix + 'draft:' + page.id) || '';
		$('rv-error').hidden = true;
		$('rv-prev').disabled = current === 0;
		$('rv-next').disabled = current === set.pages.length - 1;
		renderVerdicts();
	}

	function setBanner(text) {
		var b = $('rv-banner');
		b.textContent = text || '';
		b.hidden = !text;
	}

	function showError(text) {
		var e = $('rv-error');
		e.textContent = text;
		e.hidden = false;
		$('rv-comment').focus();
	}

	function decide(verdict) {
		var page = set.pages[current];
		var made = RV.makeVerdict(set, page, verdict, $('rv-comment').value, pageOpts(page), userId, new Date().toISOString());
		if (made.error) { showError(made.error); return; }
		$('rv-error').hidden = true;
		if (mode === 'db') {
			writing = true;
			renderVerdicts();
			db.doc('verdicts/' + page.id).set(made.doc).then(function () {
				writing = false;
				docs[page.id] = made.doc;
				store(prefix + 'draft:' + page.id, null);
				if (set.pages[current].id === page.id) { $('rv-comment').value = ''; }
				renderVerdicts();
			}, function (err) {
				writing = false;
				renderVerdicts();
				var code = err && err.code ? err.code : 'unavailable';
				var el = $('rv-status');
				el.setAttribute('data-status', 'error');
				el.textContent = code === 'invalid_argument' ?
					'Your access to this page cannot record verdicts. Use Copy feedback and paste it into the chat.' :
					'The verdict was not saved (' + code + '). Try again, or use Copy feedback.';
			});
		} else if (mode === 'local') {
			docs[page.id] = made.doc;
			store(prefix + 'local', JSON.stringify(docs));
			store(prefix + 'draft:' + page.id, null);
			$('rv-comment').value = '';
			renderVerdicts();
		}
	}

	function copyFeedback() {
		var text = RV.feedback(set, docs);
		var area = $('rv-feedback');
		var msg = $('rv-copy-msg');
		function fallback() {
			area.value = text;
			area.hidden = false;
			area.focus();
			area.select();
			msg.textContent = 'Copy the selected text and paste it into the chat.';
		}
		if (window.navigator.clipboard && window.navigator.clipboard.writeText) {
			window.navigator.clipboard.writeText(text).then(function () {
				area.hidden = true;
				msg.textContent = 'Copied. Paste it into the chat.';
			}, fallback);
		} else {
			fallback();
		}
	}

	function goLocal() {
		mode = 'local';
		db = null;
		// Only without the shared store: verdicts then live in this browser until copied.
		try { docs = JSON.parse(load(prefix + 'local') || '{}') || {}; } catch (e) { docs = {}; }
		setBanner('Local review: record your verdicts, then press Copy feedback and paste it into the chat.');
		renderVerdicts();
	}

	function goDb(handle) {
		db = handle;
		mode = 'db';
		docs = {};
		setBanner('Loading saved verdicts…');
		loadTimer = window.setTimeout(function () {
			setBanner('Saved verdicts cannot be reached yet. Verdicts you record now are still sent.');
		}, 10000);
		db.collection('verdicts').onSnapshot(function (snap) {
			var next = {};
			for (var i = 0; i < snap.docs.length; i++) {
				if (snap.docs[i].exists) { next[snap.docs[i].id] = snap.docs[i].data(); }
			}
			docs = next;
			if (!snap.metadata || !snap.metadata.fromCache) {
				if (loadTimer) { window.clearTimeout(loadTimer); loadTimer = null; }
				setBanner('');
			}
			renderVerdicts();
		}, function (err) {
			if (loadTimer) { window.clearTimeout(loadTimer); loadTimer = null; }
			setBanner('Saved verdicts could not be loaded (' + (err && err.code ? err.code : 'unavailable') + '). Use Copy feedback.');
		});
		renderVerdicts();
	}

	$('rv-verdict').addEventListener('submit', function (e) { e.preventDefault(); });
	$('rv-approve').addEventListener('click', function () { decide('approve'); });
	$('rv-disapprove').addEventListener('click', function () { decide('disapprove'); });
	$('rv-copy').addEventListener('click', copyFeedback);
	$('rv-prev').addEventListener('click', function () { if (current > 0) { window.location.hash = set.pages[current - 1].id; } });
	$('rv-next').addEventListener('click', function () { if (current < set.pages.length - 1) { window.location.hash = set.pages[current + 1].id; } });
	$('rv-comment').addEventListener('input', function () {
		var v = $('rv-comment').value;
		store(prefix + 'draft:' + set.pages[current].id, v ? v : null);
		if (v.trim()) { $('rv-error').hidden = true; }
	});
	window.addEventListener('hashchange', function () {
		render();
		$('rv-main').scrollIntoView({ block: 'start' });
	});

	if (window.matchMedia) {
		var mq = window.matchMedia(NARROW);
		var syncNav = function () { $('rv-nav-menu').open = !mq.matches; };
		syncNav();
		if (mq.addEventListener) { mq.addEventListener('change', syncNav); } else if (mq.addListener) { mq.addListener(syncNav); }
	}

	buildNav();
	render();

	if (typeof claude !== 'undefined' && claude && typeof claude.use === 'function') {
		setBanner('Connecting…');
		claude.use('user').then(function (u) {
			if (u && typeof u.id === 'function') {
				u.id().then(function (id) { userId = id || null; }, function () { userId = null; });
			}
		}, function () { userId = null; });
		claude.use('db').then(function (handle) {
			if (handle) { goDb(handle); } else { goLocal(); }
		}, goLocal);
	} else {
		goLocal();
	}
})();
</script>
